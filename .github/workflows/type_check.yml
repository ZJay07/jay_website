name: Type Check

on: [push, pull_request]

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # jlint (https://pypi.org/project/jay_lint/): import order, unused imports,
      # whitespace and line length. Needs Python 3.9+.
      - run: pip install jay_lint==0.2.0
      # Read-only ESLint + Prettier check + jlint + tsc; same as `npm run check`.
      # pleasew downloads the Please version pinned in .plzconfig.
      - run: bash ./pleasew check
