name: Type Check

on: [push, pull_request]

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Read-only ESLint + Prettier check + tsc; same as `npm run check`.
      # pleasew downloads the Please version pinned in .plzconfig.
      - run: bash ./pleasew check
